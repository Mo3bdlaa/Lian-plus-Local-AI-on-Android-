org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=true

kotlin.code.style=official

# Set to false to build the APK without compiling llama.cpp / stable-diffusion.cpp.
# The app still installs and runs, but the engines report "native library missing".
# Useful for fast UI iteration; release builds must keep this true.
lian.buildNative=true

# Comma separated ABIs. arm64-v8a covers every modern phone (incl. Galaxy S25 Ultra).
lian.abiFilters=arm64-v8a
